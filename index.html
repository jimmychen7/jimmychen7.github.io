<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jimmy Chen</title>
  <meta name="description" content="Jimmy Chen — resume, LinkedIn profile and contact details.">
  <link rel="canonical" href="https://jmychn.com/">

  <!-- Colour scheme: dark by design, light when the visitor's system asks for it -->
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">

  <!-- Link previews -->
  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="Jimmy Chen">
  <meta property="og:title" content="Jimmy Chen">
  <meta property="og:description" content="Resume, LinkedIn profile and contact details.">
  <meta property="og:url" content="https://jmychn.com/">
  <meta property="og:image" content="https://jmychn.com/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Jimmy Chen — jmychn.com">
  <meta property="profile:first_name" content="Jimmy">
  <meta property="profile:last_name" content="Chen">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Icons -->
  <link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

  <!-- Self-hosted font and styles: no third-party requests block rendering -->
  <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Jimmy Chen",
      "url": "https://jmychn.com/",
      "sameAs": ["https://www.linkedin.com/in/jimmychen07"]
    }
  </script>
</head>

<body>
  <div class="ambient" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <main>
    <article class="card">
      <header class="identity">
        <!-- Native fallback: shown when the LinkedIn badge below can't load -->
        <div class="identity__fallback">
          <span class="avatar" aria-hidden="true">JC</span>
          <h1 class="identity__name">Jimmy Chen</h1>
          <a class="identity__link" href="https://www.linkedin.com/in/jimmychen07" target="_blank"
            rel="noopener noreferrer">
            LinkedIn profile
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17 17 7" />
              <path d="M8 7h9v9" />
            </svg>
            <span class="visually-hidden">(opens in a new tab)</span>
          </a>
        </div>

        <!-- LinkedIn badge: rendered into this element by LinkedIn's script -->
        <div class="badge-base LI-profile-badge" data-locale="en_US" data-size="large" data-theme="dark"
          data-type="HORIZONTAL" data-vanity="jimmychen07" data-version="v1"><a class="badge-base__link LI-simple-link"
            href="https://au.linkedin.com/in/jimmychen07?trk=profile-badge" tabindex="-1" aria-hidden="true"></a></div>
      </header>

      <nav aria-label="Links">
        <ul class="actions" role="list">
          <li>
            <a class="button button--primary"
              href="https://docs.google.com/document/d/1w2TW0f2vS3yMgBghD-7vSqtgGJhoCJFTNWtiL78obAA/edit?usp=sharing"
              target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
                <path d="M14 3v5h5" />
                <path d="M9 13h6" />
                <path d="M9 17h6" />
              </svg>
              View Resume
              <span class="visually-hidden">(opens in a new tab)</span>
            </a>
          </li>
          <li>
            <a class="button" href="mailto:jimmy_chen_7@hotmail.com">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="m3 7 9 6 9-6" />
              </svg>
              Get in Touch
            </a>
          </li>
        </ul>
      </nav>
    </article>
  </main>

  <script>
    // Match the LinkedIn badge to the visitor's colour scheme before LinkedIn's script reads it.
    if (matchMedia('(prefers-color-scheme: light)').matches) {
      document.querySelector('.LI-profile-badge').dataset.theme = 'light';
    }
  </script>
  <!-- If the badge script is blocked, show the native fallback immediately instead of waiting -->
  <script src="https://platform.linkedin.com/badges/js/profile.js" async defer
    onerror="document.documentElement.classList.add('badge-unavailable')"></script>
</body>

</html>
